<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strichmenschen Parkour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; pointer-events: none;
    }
    .hud-item { text-align: center; }
    .hud-val  { font-size: 28px; font-weight: 900; color: #fff; }
    .hud-lbl  { font-size: 10px; letter-spacing: 3px; color: #555; text-transform: uppercase; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.9); z-index: 20;
    }
    #overlay h1 {
      font-size: 58px; font-weight: 900; letter-spacing: 6px;
      color: #fff; text-shadow: 0 0 30px #fff3;
    }
    #overlay .sub { color: #555; font-size: 14px; letter-spacing: 2px; margin: 8px 0 0; }
    #overlay .result { color: #ffcc00; font-size: 26px; font-weight: 700; margin: 18px 0 4px; min-height: 36px; }
    #overlay .best  { color: #444; font-size: 14px; letter-spacing: 1px; }
    #overlay button {
      margin-top: 28px; padding: 14px 52px;
      font-size: 18px; font-weight: 700; letter-spacing: 3px;
      border: 2px solid rgba(255,255,255,0.25); border-radius: 50px;
      background: rgba(255,255,255,0.07); color: #fff; cursor: pointer;
      transition: all 0.2s;
    }
    #overlay button:hover { background: rgba(255,255,255,0.16); border-color: #fff6; transform: scale(1.05); }

    #controls-tip {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #333; font-size: 12px; letter-spacing: 1px; pointer-events: none; text-align: center;
    }
    #controls-tip b { color: #555; }

    #jump-bar {
      position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; pointer-events: none;
    }
    .jump-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 6px #fff;
      transition: all 0.1s;
    }
    .jump-dot.used { background: #333; box-shadow: none; }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-item"><div class="hud-val" id="dist">0</div><div class="hud-lbl">Meter</div></div>
  <div class="hud-item"><div class="hud-val" id="best-hud">0</div><div class="hud-lbl">Bestleistung</div></div>
</div>

<div id="jump-bar">
  <div class="jump-dot" id="j1"></div>
  <div class="jump-dot" id="j2"></div>
</div>

<div id="overlay">
  <h1>PARKOUR</h1>
  <p class="sub">Strichmenschen Edition</p>
  <div class="result" id="result"></div>
  <div class="best"   id="best-overlay"></div>
  <button id="startBtn">SPIELEN</button>
  <p class="sub" style="margin-top: 22px; line-height: 2">
    ↑ / Leertaste — Springen · Doppel-Sprung möglich<br>
    ↓ — Sliden · Wand berühren + Springen — Wandsprung
  </p>
</div>

<div id="controls-tip">
  <b>↑ / Leertaste</b> Springen &nbsp;·&nbsp; <b>↓</b> Sliden &nbsp;·&nbsp; Wand + Springen = Wandsprung
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── Resize ────────────────────────────────────────────────────────────────
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

// ── Constants ─────────────────────────────────────────────────────────────
const GR        = 1100;   // gravity px/s²
const RUN_SPEED = 320;    // px/s
const JUMP_V    = -480;   // px/s
const WALL_JUMP_V_X = 340;
const WALL_JUMP_V_Y = -430;
const SLIDE_DUR = 0.45;   // seconds

// ── Game state ─────────────────────────────────────────────────────────────
let cam = 0;              // camera scroll X
let score = 0;
let best  = parseInt(localStorage.getItem('pkBest') || '0');
let gameRunning = false;

// ── Input ─────────────────────────────────────────────────────────────────
const keys = {};
let jumpPress = false, slidePress = false;
window.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jumpPress = true;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') slidePress = true;
  }
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Mobile buttons
let touchJump = false, touchSlide = false;

// ── Player ────────────────────────────────────────────────────────────────
const P_W = 22, P_H = 60;
const player = {
  x: 120, y: 0,
  vx: RUN_SPEED, vy: 0,
  w: P_W, h: P_H,
  onGround: false,
  onWall: 0,       // -1 left, 0 none, 1 right
  jumpsLeft: 2,
  sliding: false,
  slideTimer: 0,
  wallJumpCooldown: 0,
  coyoteTime: 0,
  animTime: 0,
  state: 'run',    // run | jump | fall | slide | walljump
  dustParticles: [],
  trail: [],
};

// ── Platforms ─────────────────────────────────────────────────────────────
const platforms = [];
const GROUND_Y = () => canvas.height * 0.72;

// ── Level generation ───────────────────────────────────────────────────────
let genX = 0;
const CHUNK_W = 380;

const OBSTACLE_TYPES = ['gap','rise','wall','lowceiling','moving','double'];

function generateChunk(startX, difficulty) {
  const d = Math.min(1, difficulty);
  const type = OBSTACLE_TYPES[Math.floor(Math.random() * (2 + Math.floor(d * 4)))];
  const gy = GROUND_Y();
  const plats = [];

  // Ground before obstacle
  plats.push({ x: startX, y: gy, w: 120 + Math.random() * 60, h: 24, moving: false, color: 0 });

  if (type === 'gap') {
    const gapW = 80 + d * 100 + Math.random() * 60;
    plats.push({ x: startX + 180 + gapW, y: gy, w: 200, h: 24, moving: false, color: 0 });
  } else if (type === 'rise') {
    const rh = 60 + d * 80;
    plats.push({ x: startX + 160, y: gy - rh, w: 80 + Math.random() * 60, h: 24, moving: false, color: 1 });
    plats.push({ x: startX + 260 + 80, y: gy, w: 160, h: 24, moving: false, color: 0 });
  } else if (type === 'wall') {
    // Wall to wall-jump off
    plats.push({ x: startX + 170, y: gy - 200, w: 22, h: 200, h_type: 'wall', moving: false, color: 2 });
    plats.push({ x: startX + 270, y: gy, w: 200, h: 24, moving: false, color: 0 });
  } else if (type === 'lowceiling') {
    plats.push({ x: startX + 130, y: gy - P_H * 0.7, w: 160, h: 18, ceiling: true, moving: false, color: 3 });
    plats.push({ x: startX + 130, y: gy, w: 160, h: 24, moving: false, color: 0 });
    plats.push({ x: startX + 310, y: gy, w: 200, h: 24, moving: false, color: 0 });
  } else if (type === 'moving') {
    const ph = 60 + d * 80;
    plats.push({ x: startX + 160, y: gy - ph, w: 70, h: 18, moving: true,
      moveY: gy - ph, moveRange: 80 + d * 40, moveSpeed: 1.5 + d, moveT: 0, color: 4 });
    plats.push({ x: startX + 310, y: gy, w: 200, h: 24, moving: false, color: 0 });
  } else if (type === 'double') {
    plats.push({ x: startX + 150, y: gy - 90, w: 60, h: 18, moving: false, color: 1 });
    plats.push({ x: startX + 250, y: gy - 160, w: 60, h: 18, moving: false, color: 4 });
    plats.push({ x: startX + 360, y: gy, w: 200, h: 24, moving: false, color: 0 });
  } else {
    plats.push({ x: startX + 180, y: gy, w: 200, h: 24, moving: false, color: 0 });
  }

  return plats;
}

// Platform colors
const PLAT_COLORS = [
  '#1a1a2e', // ground
  '#16213e', // raised
  '#0f3460', // wall
  '#1a1a1a', // ceiling
  '#0d0d2b', // moving
];
const PLAT_EDGE_COLORS = ['#3a3a5c','#2a4080','#1a5090','#333','#2244aa'];

function initLevel() {
  platforms.length = 0;
  genX = 0;
  const gy = GROUND_Y();

  // Starting ground
  platforms.push({ x: -200, y: gy, w: 380, h: 24, moving: false, color: 0 });
  genX = 180;

  for (let i = 0; i < 6; i++) {
    const chunks = generateChunk(genX, 0);
    platforms.push(...chunks);
    genX += CHUNK_W;
  }
}

function ensureChunks() {
  const rightEdge = cam + canvas.width + 400;
  while (genX < rightEdge) {
    const diff = score / 600;
    const chunks = generateChunk(genX, diff);
    platforms.push(...chunks);
    genX += CHUNK_W;
  }
  // Remove far-left
  for (let i = platforms.length - 1; i >= 0; i--) {
    if (platforms[i].x + platforms[i].w < cam - 300) platforms.splice(i, 1);
  }
}

// ── Particles ─────────────────────────────────────────────────────────────
const particles = [];

function spawnDust(x, y, count, col) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 120,
      vy: -(Math.random() * 80 + 20),
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.4 + Math.random() * 0.3,
      r: 2 + Math.random() * 3,
      col: col || 'rgba(255,255,255,',
    });
  }
}

// ── Draw background ────────────────────────────────────────────────────────
function drawBg() {
  const gy = GROUND_Y();
  const w  = canvas.width;
  const h  = canvas.height;

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#050510');
  sky.addColorStop(0.7, '#0a0a20');
  sky.addColorStop(1, '#0d0d18');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  // City silhouette (parallax: moves at 0.3x speed)
  ctx.fillStyle = '#080816';
  const buildingX = -((cam * 0.3) % 240);
  for (let bx = buildingX - 240; bx < w + 240; bx += 60 + (Math.abs(Math.sin(bx * 0.01)) * 40 | 0)) {
    const bh = 80 + (Math.abs(Math.sin(bx * 0.05)) * 120 | 0);
    ctx.fillRect(bx, gy - bh, 55, bh);
    // Windows
    ctx.fillStyle = '#0f1530';
    for (let wy = gy - bh + 10; wy < gy - 10; wy += 18) {
      for (let wx = bx + 6; wx < bx + 49; wx += 14) {
        if (Math.sin(wx * 3.7 + wy * 2.1) > 0.2) {
          ctx.fillRect(wx, wy, 8, 10);
        }
      }
    }
    ctx.fillStyle = '#080816';
  }

  // Ground line
  ctx.fillStyle = '#111124';
  ctx.fillRect(0, gy + 24, w, h - gy - 24);

  // Stars (parallax 0.1x)
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const sx = -((cam * 0.08) % 200);
  for (let i = 0; i < 60; i++) {
    const starX = ((i * 137 + sx) % (w + 40)) - 20;
    const starY = (i * 73) % (gy * 0.6);
    const br    = Math.sin(Date.now() * 0.001 + i) * 0.3 + 0.7;
    ctx.globalAlpha = br * 0.8;
    ctx.fillRect(starX, starY, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;
}

// ── Draw platforms ────────────────────────────────────────────────────────
function drawPlatforms() {
  for (const p of platforms) {
    const sx = p.x - cam;
    if (sx > canvas.width + 50 || sx + p.w < -50) continue;

    const isWall    = p.h_type === 'wall';
    const isCeiling = p.ceiling;
    const col  = PLAT_COLORS[p.color] || '#1a1a2e';
    const edge = PLAT_EDGE_COLORS[p.color] || '#3a3a5c';

    ctx.fillStyle = col;
    ctx.fillRect(sx, p.y, p.w, p.h);

    // Top edge highlight
    if (!isCeiling) {
      ctx.fillStyle = edge;
      ctx.fillRect(sx, p.y, p.w, 3);
    } else {
      ctx.fillStyle = edge;
      ctx.fillRect(sx, p.y + p.h - 3, p.w, 3);
    }

    // Moving platform glow
    if (p.moving) {
      ctx.shadowColor = '#4466ff';
      ctx.shadowBlur  = 12;
      ctx.fillStyle   = '#223399';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.shadowBlur  = 0;
    }
  }
}

// ── Draw stick figure ─────────────────────────────────────────────────────
function drawStick(px, py, state, t, sliding, wallSide) {
  const x  = px - cam;
  const lw = 3.5;
  ctx.save();
  ctx.translate(x, py);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth   = lw;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#88aaff';
  ctx.lineWidth = lw + 4;
  ctx.restore();

  if (sliding) {
    // Sliding pose: body horizontal, low
    const lean = -1.1;
    ctx.save();
    ctx.rotate(lean);
    // Head
    ctx.beginPath(); ctx.arc(0, -12, 8, 0, Math.PI*2); ctx.stroke();
    // Body
    line(ctx, 0, -4, 0, 16);
    // Arms back
    line(ctx, 0, 4, -18, -2);
    line(ctx, 0, 4, 12, 10);
    // Legs forward
    line(ctx, 0, 16, 18, 22);
    line(ctx, 0, 16, -10, 28);
    ctx.restore();

  } else if (state === 'walljump') {
    const flip = wallSide > 0 ? 1 : -1;
    ctx.scale(flip, 1);
    // Head
    ctx.beginPath(); ctx.arc(0, -52, 9, 0, Math.PI*2); ctx.stroke();
    // Body
    line(ctx, 0, -43, 0, -18);
    // Arms: one against wall, one out
    line(ctx, 0, -36, 16, -30);
    line(ctx, 0, -36, -14, -22);
    // Legs: kick off
    line(ctx, 0, -18, 14, 0);
    line(ctx, 0, -18, -12, -8);
    ctx.scale(flip, 1);

  } else if (state === 'jump' || state === 'fall') {
    const rise = state === 'jump';
    // Head
    ctx.beginPath(); ctx.arc(0, -52, 9, 0, Math.PI*2); ctx.stroke();
    // Body
    line(ctx, 0, -43, 0, -18);
    // Arms out
    const armAngle = rise ? -0.6 : 0.3;
    line(ctx, 0, -36, Math.cos(armAngle)*20, -36 + Math.sin(armAngle)*20);
    line(ctx, 0, -36, -Math.cos(armAngle)*20, -36 + Math.sin(armAngle)*20);
    // Legs
    const legBend = rise ? -0.4 : 0.3;
    line(ctx, 0, -18, -10, -18 + 14 + legBend*10);
    line(ctx, -10, -18 + 14 + legBend*10, -6, -18 + 28 + legBend*6);
    line(ctx, 0, -18, 10, -18 + 14 + legBend*10);
    line(ctx, 10, -18 + 14 + legBend*10, 6, -18 + 28 + legBend*6);

  } else {
    // Running animation
    const phase = t * 9;
    const bob   = Math.abs(Math.sin(phase)) * 3;
    // Head
    ctx.beginPath(); ctx.arc(0, -52 - bob, 9, 0, Math.PI*2); ctx.stroke();
    // Body lean forward
    const lean  = 0.18;
    const bx2   = Math.sin(lean) * 25;
    const by2   = Math.cos(lean) * 25;
    line(ctx, 0, -43 - bob, bx2, -43 - bob + by2);
    // Hip
    const hx = bx2, hy = -43 - bob + by2;
    // Arms swing
    const armSwing = Math.sin(phase) * 0.7;
    line(ctx, bx2*0.5, -43 - bob + by2*0.4,
         bx2*0.5 + Math.cos(armSwing)*18,
         -43 - bob + by2*0.4 + Math.sin(armSwing)*18);
    line(ctx, bx2*0.5, -43 - bob + by2*0.4,
         bx2*0.5 - Math.cos(armSwing)*18,
         -43 - bob + by2*0.4 - Math.sin(armSwing)*18);
    // Legs run cycle
    const ls = Math.sin(phase);
    const rs = Math.sin(phase + Math.PI);
    // Left leg
    const lkx = hx + ls * 12,  lky = hy + 14;
    const lfx = hx + ls * 6,   lfy = hy + 28;
    line(ctx, hx, hy, lkx, lky);
    line(ctx, lkx, lky, lfx, lfy);
    // Right leg
    const rkx = hx + rs * 12,  rky = hy + 14;
    const rfx = hx + rs * 6,   rfy = hy + 28;
    line(ctx, hx, hy, rkx, rky);
    line(ctx, rkx, rky, rfx, rfy);
  }

  ctx.restore();
}

function line(ctx, x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

// ── Trail ─────────────────────────────────────────────────────────────────
const trail = [];
function updateTrail(px, py, state) {
  if (state === 'run' || state === 'slide') {
    trail.push({ x: px, y: py, a: 0.25, state });
  }
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].a -= 0.03;
    if (trail[i].a <= 0) trail.splice(i, 1);
  }
}

function drawTrail() {
  for (const t of trail) {
    const sx = t.x - cam;
    ctx.save();
    ctx.globalAlpha = t.a;
    ctx.strokeStyle = '#8899ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, t.y - 30, 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// ── Physics & update ───────────────────────────────────────────────────────
function update(dt) {
  const gy = GROUND_Y();
  const p  = player;

  // Animate
  p.animTime += dt;
  if (p.slideTimer > 0) p.slideTimer -= dt;
  if (p.wallJumpCooldown > 0) p.wallJumpCooldown -= dt;
  if (p.coyoteTime > 0) p.coyoteTime -= dt;

  // Sliding state
  p.sliding = p.slideTimer > 0;

  // Gravity
  p.vy += GR * dt;

  // Move
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  // Update moving platforms
  for (const pl of platforms) {
    if (pl.moving) {
      pl.moveT += dt;
      pl.y = pl.moveY + Math.sin(pl.moveT * pl.moveSpeed) * pl.moveRange;
    }
  }

  // Collision
  p.onGround = false;
  p.onWall   = 0;
  const ph = p.sliding ? P_H * 0.48 : P_H;
  const pw = p.w;

  for (const pl of platforms) {
    if (pl.x + pl.w < p.x || pl.x > p.x + pw) continue;

    const isWall    = pl.h_type === 'wall';
    const isCeiling = pl.ceiling;

    if (isWall) {
      // Wall collision
      if (p.y + ph > pl.y && p.y < pl.y + pl.h) {
        if (p.x + pw > pl.x && p.x + pw < pl.x + pl.w + 10) {
          p.x = pl.x - pw;
          p.onWall = 1;
          p.vx = Math.min(p.vx, 20);
          if (p.vy > 80) p.vy = 80; // slow slide down wall
        } else if (p.x < pl.x + pl.w && p.x > pl.x - 10) {
          p.x = pl.x + pl.w;
          p.onWall = -1;
          p.vx = Math.max(p.vx, -20);
          if (p.vy > 80) p.vy = 80;
        }
      }
      continue;
    }

    if (isCeiling) {
      // Ceiling: block from above
      if (p.y < pl.y + pl.h && p.y + ph > pl.y && p.vy < 0) {
        if (p.x + pw > pl.x && p.x < pl.x + pl.w) {
          p.y = pl.y + pl.h;
          p.vy = 0;
        }
      }
      continue;
    }

    // Floor platform
    const overlapX = p.x + pw > pl.x && p.x < pl.x + pl.w;
    if (overlapX) {
      // Landing from above
      const prevY = p.y - p.vy * dt;
      if (p.vy >= 0 && prevY + ph <= pl.y + 4 && p.y + ph >= pl.y) {
        if (p.onGround === false && p.vy > 200) {
          spawnDust(p.x + pw / 2, pl.y, 8, 'rgba(120,140,255,');
        }
        p.y = pl.y - ph;
        p.vy = 0;
        p.onGround = true;
        p.jumpsLeft = 2;
        p.coyoteTime = 0.12;
      }
    }
  }

  // Wall jump / slide restore jump
  if (p.onWall !== 0 && !p.onGround) {
    p.jumpsLeft = Math.max(p.jumpsLeft, 1);
  }

  // Jump input
  if (jumpPress) {
    jumpPress = false;
    if (p.onGround || p.coyoteTime > 0) {
      p.vy = JUMP_V;
      p.jumpsLeft = 1;
      p.onGround = false;
      p.coyoteTime = 0;
      spawnDust(p.x + pw / 2, p.y + ph, 6, 'rgba(200,220,255,');
    } else if (p.onWall !== 0 && p.wallJumpCooldown <= 0) {
      // Wall jump!
      p.vy = WALL_JUMP_V_Y;
      p.vx = p.onWall < 0 ? WALL_JUMP_V_X : -WALL_JUMP_V_X;
      p.wallJumpCooldown = 0.25;
      p.onWall = 0;
      spawnDust(p.x + pw / 2, p.y + ph / 2, 8, 'rgba(80,180,255,');
      p.state = 'walljump';
    } else if (p.jumpsLeft > 0) {
      // Double jump
      p.vy = JUMP_V * 0.88;
      p.jumpsLeft--;
      spawnDust(p.x + pw / 2, p.y + ph, 10, 'rgba(160,200,255,');
    }
  }

  // Slide input
  if (slidePress && p.onGround) {
    slidePress = false;
    p.slideTimer = SLIDE_DUR;
    p.vx = RUN_SPEED * 1.6;
    spawnDust(p.x + pw / 2, p.y + ph, 5, 'rgba(180,180,255,');
  }
  slidePress = false;

  // Restore run speed
  if (!p.sliding) {
    p.vx += (RUN_SPEED - p.vx) * dt * 4;
  }

  // State machine
  if (p.sliding)       p.state = 'slide';
  else if (p.onWall !== 0 && !p.onGround) p.state = 'wallslide';
  else if (!p.onGround && p.vy < 0)       p.state = 'jump';
  else if (!p.onGround && p.vy > 0)       p.state = 'fall';
  else                                     p.state = 'run';

  // Camera
  const targetCam = p.x - canvas.width * 0.3;
  cam += (targetCam - cam) * dt * 6;

  // Score
  score = Math.max(score, Math.floor((p.x - 120) / 6));
  if (score > best) { best = score; localStorage.setItem('pkBest', best); }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    if (pt.life <= 0) { particles.splice(i, 1); continue; }
    pt.x  += pt.vx * dt;
    pt.y  += pt.vy * dt;
    pt.vy += 200 * dt;
  }

  // Death: fell off
  if (p.y > canvas.height + 100) die();

  // Generate more
  ensureChunks();
  updateTrail(p.x, p.y, p.state);
}

// ── Draw everything ────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBg();
  drawTrail();
  drawPlatforms();

  // Particles
  for (const pt of particles) {
    const alpha = pt.life / pt.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.col + alpha + ')';
    ctx.beginPath();
    ctx.arc(pt.x - cam, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Character
  const p = player;
  const ph = p.sliding ? P_H * 0.48 : P_H;
  drawStick(p.x + p.w / 2, p.y + ph, p.state, p.animTime, p.sliding, p.onWall);

  // Jump indicators
  document.getElementById('j1').className = 'jump-dot' + (p.jumpsLeft < 2 ? ' used' : '');
  document.getElementById('j2').className = 'jump-dot' + (p.jumpsLeft < 1 ? ' used' : '');

  // HUD
  document.getElementById('dist').textContent      = score + 'm';
  document.getElementById('best-hud').textContent  = best + 'm';

  // Speed lines when fast
  if (p.vx > 380) {
    ctx.save();
    ctx.globalAlpha = (p.vx - 380) / 300 * 0.3;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      const ly = Math.random() * canvas.height;
      ctx.beginPath();
      ctx.moveTo(canvas.width * 0.35, ly);
      ctx.lineTo(canvas.width * 0.35 - 60 - Math.random() * 80, ly);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ── Game flow ──────────────────────────────────────────────────────────────
function die() {
  gameRunning = false;
  document.getElementById('result').textContent = score > 0 ? `${score}m zurückgelegt!` : 'Gleich beim Start gefallen!';
  document.getElementById('best-overlay').textContent = best > 0 ? `Bestleistung: ${best}m` : '';
  document.getElementById('startBtn').textContent = score > 0 ? 'NOCHMAL' : 'SPIELEN';
  document.getElementById('overlay').style.display = 'flex';
}

function startGame() {
  const gy = GROUND_Y();
  player.x = 100;
  player.y = gy - P_H;
  player.vx = RUN_SPEED;
  player.vy = 0;
  player.onGround = false;
  player.jumpsLeft = 2;
  player.sliding = false;
  player.slideTimer = 0;
  player.wallJumpCooldown = 0;
  player.coyoteTime = 0;
  player.state = 'run';
  cam = 0;
  score = 0;
  trail.length = 0;
  particles.length = 0;
  jumpPress = false;
  slidePress = false;

  initLevel();
  gameRunning = true;
  document.getElementById('overlay').style.display = 'none';
}

document.getElementById('startBtn').addEventListener('click', startGame);

// ── Loop ──────────────────────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  if (gameRunning) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
