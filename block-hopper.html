<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Block Hopper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 28px;
      background: rgba(0,0,0,0.5);
      pointer-events: none;
    }
    .hud-box {
      text-align: center;
      color: #fff;
    }
    .hud-label { font-size: 11px; letter-spacing: 3px; color: #aaa; text-transform: uppercase; }
    .hud-value { font-size: 30px; font-weight: 700; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(10,10,30,0.92);
      z-index: 20;
    }
    #overlay h1 {
      font-size: 64px; font-weight: 900;
      background: linear-gradient(135deg, #f90, #f0f, #0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    #overlay .sub { color: #888; font-size: 16px; margin-bottom: 6px; }
    #overlay .score-big { color: #fff; font-size: 40px; font-weight: 700; margin: 16px 0; }
    #overlay button {
      margin-top: 20px; padding: 16px 50px;
      font-size: 20px; font-weight: 700; letter-spacing: 2px;
      border: none; border-radius: 50px; cursor: pointer;
      background: linear-gradient(135deg, #f90, #f0f);
      color: #fff;
      box-shadow: 0 4px 30px #f904;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #overlay button:hover { transform: scale(1.06); box-shadow: 0 6px 40px #f908; }

    #tip {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: #fff7; font-size: 13px; letter-spacing: 1px;
      pointer-events: none; text-align: center;
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">Blöcke</div>
    <div class="hud-value" id="score">0</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Bestleistung</div>
    <div class="hud-value" id="best">0</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Combo</div>
    <div class="hud-value" id="combo">x1</div>
  </div>
</div>

<div id="overlay">
  <h1>BLOCK HOPPER</h1>
  <p class="sub">Spring von Block zu Block – falle nicht!</p>
  <p class="score-big" id="final-score"></p>
  <button id="startBtn">SPIELEN</button>
  <p class="sub" style="margin-top:20px">← → bewegen &nbsp;·&nbsp; LEERTASTE springen</p>
</div>

<div id="tip">← → / A D bewegen &nbsp;·&nbsp; LEERTASTE springen &nbsp;·&nbsp; Maus ziehen = Kamera</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

// ── Renderer ─────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d2b);
scene.fog = new THREE.Fog(0x0d0d2b, 30, 80);

// ── Camera ────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 200);
let camYaw = 0, camPitch = 0.42;
const CAM_DIST = 12;

// ── Lights ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x334466, 2));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(10, 20, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -30;
sun.shadow.camera.right = sun.shadow.camera.top  =  30;
sun.shadow.camera.far = 80;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x4466ff, 0.6);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// ── Stars ────────────────────────────────────────────────────────────────
{
  const g = new THREE.BufferGeometry();
  const v = [];
  for (let i = 0; i < 1000; i++) v.push((Math.random()-0.5)*300, Math.random()*80+10, (Math.random()-0.5)*300);
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.7 })));
}

// ── Block colors ─────────────────────────────────────────────────────────
const BLOCK_COLORS = [
  0xff6b35, 0xff3385, 0xaa33ff, 0x33aaff,
  0x33ff99, 0xffcc00, 0xff4444, 0x44ffee,
];

function randomColor() { return BLOCK_COLORS[Math.floor(Math.random() * BLOCK_COLORS.length)]; }

// ── Block system ─────────────────────────────────────────────────────────
const blocks = [];  // { mesh, x, y, z, w, d, color, visited, wobble }
const blockGroup = new THREE.Group();
scene.add(blockGroup);

function makeBlock(x, y, z, w, d, color, wobble = false) {
  const geo = new THREE.BoxGeometry(w, 0.6, d);
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.4,
    metalness: 0.3,
    emissive: color,
    emissiveIntensity: 0.08,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  blockGroup.add(mesh);

  // Top face highlight
  const topGeo = new THREE.PlaneGeometry(w - 0.06, d - 0.06);
  const topMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 });
  const top = new THREE.Mesh(topGeo, topMat);
  top.rotation.x = -Math.PI / 2;
  top.position.y = 0.31;
  mesh.add(top);

  const b = { mesh, x, y, z, w, d, color, visited: false, wobble, wobblePhase: Math.random() * Math.PI * 2 };
  blocks.push(b);
  return b;
}

function removeOldBlocks(playerZ) {
  for (let i = blocks.length - 1; i >= 0; i--) {
    if (blocks[i].z > playerZ + 20) {
      blockGroup.remove(blocks[i].mesh);
      blocks.splice(i, 1);
    }
  }
}

let nextBlockZ = 0;
let difficulty = 0;

function generateBlocks(untilZ) {
  while (nextBlockZ > untilZ - 40) {
    difficulty = Math.max(0, -nextBlockZ / 30); // increases as z decreases

    const gap    = 2.5 + difficulty * 0.35 + Math.random() * 1.2;
    const xOff   = (Math.random() - 0.5) * (3 + difficulty * 0.6);
    const yOff   = (Math.random() - 0.5) * Math.min(2.5, difficulty * 0.5);
    const w      = Math.max(1.0, 3.5 - difficulty * 0.18 + (Math.random() - 0.5));
    const d      = Math.max(1.0, 3.5 - difficulty * 0.18 + (Math.random() - 0.5));
    const wobble = difficulty > 3 && Math.random() < 0.3;
    const color  = randomColor();

    const lastBlock = blocks[0] || { x: 0, y: 0, z: 0 };
    nextBlockZ -= gap + d / 2 + (blocks[0] ? blocks[0].d / 2 : 2);

    const newX = Math.max(-6, Math.min(6, (blocks[0]?.x ?? 0) + xOff));
    const newY = Math.max(-3, Math.min(4, (blocks[0]?.y ?? 0) + yOff));

    makeBlock(newX, newY, nextBlockZ, w, d, color, wobble);
  }
}

// ── Character ─────────────────────────────────────────────────────────────
const charGroup = new THREE.Group();
scene.add(charGroup);

// Body
const bodyMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.55, 0.75, 0.4),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 })
);
bodyMesh.position.y = 0.95;
bodyMesh.castShadow = true;
charGroup.add(bodyMesh);

// Head
const headMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.45, 0.45, 0.45),
  new THREE.MeshStandardMaterial({ color: 0xffcc88, roughness: 0.6 })
);
headMesh.position.y = 1.6;
headMesh.castShadow = true;
charGroup.add(headMesh);

// Eyes
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222 });
[-0.1, 0.1].forEach(ox => {
  const e = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.1), eyeMat);
  e.position.set(ox, 1.63, 0.21); charGroup.add(e);
});

// Legs
const legMat = new THREE.MeshStandardMaterial({ color: 0x334499, roughness: 0.6 });
const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), legMat);
const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), legMat);
lLeg.position.set(-0.16, 0.35, 0); lLeg.castShadow = true;
rLeg.position.set( 0.16, 0.35, 0); rLeg.castShadow = true;
charGroup.add(lLeg, rLeg);

// Arms
const armMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.5, 0.18), armMat);
const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.5, 0.18), armMat);
lArm.position.set(-0.40, 0.95, 0); lArm.castShadow = true;
rArm.position.set( 0.40, 0.95, 0); rArm.castShadow = true;
charGroup.add(lArm, rArm);

// ── Shadow blob under character ───────────────────────────────────────────
const shadowBlob = new THREE.Mesh(
  new THREE.CircleGeometry(0.4, 16),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false })
);
shadowBlob.rotation.x = -Math.PI / 2;
scene.add(shadowBlob);

// ── Particle pool (for landing) ───────────────────────────────────────────
const particles = [];
function spawnParticles(x, y, z, color) {
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 0.18, 0.18),
      new THREE.MeshBasicMaterial({ color })
    );
    m.position.set(x, y + 0.3, z);
    scene.add(m);
    particles.push({
      mesh: m,
      vx: (Math.random()-0.5)*5,
      vy: Math.random()*4+2,
      vz: (Math.random()-0.5)*5,
      life: 0.6,
    });
  }
}

// ── State ─────────────────────────────────────────────────────────────────
const pos = new THREE.Vector3(0, 1, 0);
const vel = new THREE.Vector3(0, 0, 0);
const GRAVITY   = -28;
const JUMP_VEL  = 12;
const MOVE_SPEED = 7;
const MOVE_ACCEL = 50;
let onGround = false;
let canJump  = false;
let walkTime = 0;
let gameRunning = false;
let score = 0;
let best  = parseInt(localStorage.getItem('bhBest') || '0');
let combo = 1;
let lastBlockIdx = -1;
let invincible = 0;

document.getElementById('best').textContent = best;

// ── Input ─────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let isDrag = false, lastMX = 0, lastMY = 0;
renderer.domElement.addEventListener('mousedown', e => { isDrag = true; lastMX = e.clientX; lastMY = e.clientY; });
window.addEventListener('mouseup', () => { isDrag = false; });
window.addEventListener('mousemove', e => {
  if (!isDrag) return;
  camYaw   -= (e.clientX - lastMX) * 0.005;
  camPitch -= (e.clientY - lastMY) * 0.005;
  camPitch = Math.max(0.1, Math.min(1.3, camPitch));
  lastMX = e.clientX; lastMY = e.clientY;
});

// ── UI ────────────────────────────────────────────────────────────────────
const overlay    = document.getElementById('overlay');
const finalScore = document.getElementById('final-score');
const startBtn   = document.getElementById('startBtn');

startBtn.addEventListener('click', startGame);

function startGame() {
  // Clear old blocks
  blocks.forEach(b => blockGroup.remove(b.mesh));
  blocks.length = 0;
  particles.forEach(p => scene.remove(p.mesh));
  particles.length = 0;

  nextBlockZ = 0;
  difficulty = 0;
  score = 0;
  combo = 1;
  lastBlockIdx = -1;
  invincible = 0.5;

  // Starting block (wide)
  makeBlock(0, 0, 0, 6, 6, 0x44aaff, false);
  generateBlocks(-60);

  pos.set(0, 1, 0);
  vel.set(0, 0, 0);
  camYaw = 0;
  onGround = true;
  canJump  = true;
  gameRunning = true;

  updateHUD();
  overlay.style.display = 'none';
}

function gameOver() {
  gameRunning = false;
  if (score > best) {
    best = score;
    localStorage.setItem('bhBest', best);
  }
  document.getElementById('best').textContent = best;
  finalScore.textContent = score > 0 ? `${score} Blöcke erreicht!` : '';
  overlay.style.display = 'flex';
  startBtn.textContent = score > 0 ? 'NOCHMAL' : 'SPIELEN';
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent  = best;
  document.getElementById('combo').textContent = `x${combo}`;
}

// ── Physics helpers ───────────────────────────────────────────────────────
function getBlockBelow(px, py, pz) {
  let best = null, bestY = -Infinity;
  for (const b of blocks) {
    const hw = b.w / 2 + 0.27;
    const hd = b.d / 2 + 0.27;
    if (px > b.x - hw && px < b.x + hw && pz > b.z - hd && pz < b.z + hd) {
      const top = b.y + 0.3;
      if (top <= py + 0.15 && top > bestY) {
        bestY = top;
        best  = b;
      }
    }
  }
  return best;
}

// ── Clock & loop ──────────────────────────────────────────────────────────
const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!gameRunning) {
    renderer.render(scene, camera);
    return;
  }

  invincible = Math.max(0, invincible - dt);

  // ── Input → velocity ────────────────────────────────────────────────────
  const fwd = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
  const rgt = new THREE.Vector3( Math.cos(camYaw), 0, -Math.sin(camYaw));

  let moveX = 0, moveZ = 0;
  if (keys['KeyA'] || keys['ArrowLeft'])  { moveX -= 1; }
  if (keys['KeyD'] || keys['ArrowRight']) { moveX += 1; }
  if (keys['KeyW'] || keys['ArrowUp'])    { moveZ -= 1; }
  if (keys['KeyS'] || keys['ArrowDown'])  { moveZ += 1; }

  const moveDir = new THREE.Vector3(
    fwd.x * moveZ + rgt.x * moveX,
    0,
    fwd.z * moveZ + rgt.z * moveX
  );
  if (moveDir.lengthSq() > 0) {
    moveDir.normalize();
    charGroup.rotation.y = Math.atan2(moveDir.x, moveDir.z);
  }

  vel.x += moveDir.x * MOVE_ACCEL * dt;
  vel.z += moveDir.z * MOVE_ACCEL * dt;

  // Speed cap
  const horizSpeed = Math.sqrt(vel.x*vel.x + vel.z*vel.z);
  if (horizSpeed > MOVE_SPEED) {
    vel.x = vel.x / horizSpeed * MOVE_SPEED;
    vel.z = vel.z / horizSpeed * MOVE_SPEED;
  }

  // Friction
  vel.x *= Math.pow(0.75, dt * 60);
  vel.z *= Math.pow(0.75, dt * 60);

  // Jump
  if ((keys['Space'] || keys['KeyZ']) && canJump && onGround) {
    vel.y = JUMP_VEL;
    onGround = false;
    canJump  = false;
    lLeg.rotation.x  = -0.5;
    rLeg.rotation.x  =  0.5;
  }
  if (!keys['Space'] && !keys['KeyZ']) canJump = true;

  // Gravity
  vel.y += GRAVITY * dt;

  // Move
  pos.addScaledVector(vel, dt);

  // Floor detection
  const block = getBlockBelow(pos.x, pos.y, pos.z);
  if (block && vel.y <= 0) {
    const top = block.y + 0.3;
    pos.y = top + 0.55;
    vel.y = 0;

    if (!onGround) {
      // Just landed!
      spawnParticles(pos.x, top, pos.z, block.color);
      if (!block.visited) {
        block.visited = true;
        const blockIdx = blocks.indexOf(block);
        if (blockIdx !== lastBlockIdx) {
          score++;
          combo = blockIdx === lastBlockIdx + 1 ? combo + 1 : 1;
          if (combo > 1) score += combo - 1; // bonus
          lastBlockIdx = blockIdx;
          updateHUD();
          if (score > best) { best = score; document.getElementById('best').textContent = best; }
        }
      }
    }
    onGround = true;

    // Wobble block
    if (block.wobble) {
      block.wobblePhase += dt * 5;
    }
  } else {
    onGround = false;
  }

  // Fall off
  if (pos.y < -12 && invincible <= 0) {
    gameOver();
    return;
  }

  // Generate more blocks ahead
  generateBlocks(pos.z);
  removeOldBlocks(pos.z);

  // ── Character animation ─────────────────────────────────────────────────
  charGroup.position.copy(pos);
  charGroup.position.y = pos.y - 0.55;

  const moving = moveDir.lengthSq() > 0.01;
  if (moving && onGround) { walkTime += dt; }
  const swing = onGround ? Math.sin(walkTime * 9) * 0.45 : 0.3;
  lLeg.rotation.x = THREE.MathUtils.lerp(lLeg.rotation.x,  swing, 0.3);
  rLeg.rotation.x = THREE.MathUtils.lerp(rLeg.rotation.x, -swing, 0.3);
  lArm.rotation.x = THREE.MathUtils.lerp(lArm.rotation.x, -swing * 0.7, 0.3);
  rArm.rotation.x = THREE.MathUtils.lerp(rArm.rotation.x,  swing * 0.7, 0.3);

  // Body squish on landing
  if (onGround) {
    bodyMesh.scale.y = THREE.MathUtils.lerp(bodyMesh.scale.y, 1, 0.2);
  }

  // Shadow
  const shadowBlock = getBlockBelow(pos.x, pos.y + 5, pos.z);
  if (shadowBlock) {
    shadowBlob.position.set(pos.x, shadowBlock.y + 0.31, pos.z);
    shadowBlob.material.opacity = Math.max(0, 0.35 - (pos.y - shadowBlock.y) * 0.04);
    shadowBlob.visible = true;
  } else {
    shadowBlob.visible = false;
  }

  // ── Wobble blocks ───────────────────────────────────────────────────────
  for (const b of blocks) {
    if (b.wobble) {
      b.mesh.position.y = b.y + Math.sin(clock.elapsedTime * 2 + b.wobblePhase) * 0.4;
    }
  }

  // ── Next block highlight ─────────────────────────────────────────────────
  // Find closest unvisited block ahead
  let closest = null, closestDist = Infinity;
  for (const b of blocks) {
    if (!b.visited && b.z < pos.z) {
      const dist = pos.distanceTo(new THREE.Vector3(b.x, b.y, b.z));
      if (dist < closestDist) { closestDist = dist; closest = b; }
    }
  }
  for (const b of blocks) {
    const pulse = 0.08 + Math.sin(clock.elapsedTime * 4) * 0.05;
    b.mesh.material.emissiveIntensity = (b === closest) ? pulse * 3 : 0.08;
  }

  // ── Particles ───────────────────────────────────────────────────────────
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); continue; }
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 18 * dt;
    const s = p.life / 0.6;
    p.mesh.scale.setScalar(s);
    p.mesh.material.opacity = s;
    p.mesh.material.transparent = true;
  }

  // ── Sun follows player ──────────────────────────────────────────────────
  sun.position.set(pos.x + 10, pos.y + 20, pos.z + 5);
  sun.target.position.copy(pos);
  sun.target.updateMatrixWorld();

  // ── Camera ──────────────────────────────────────────────────────────────
  const cx =  Math.cos(camPitch) * Math.sin(camYaw) * CAM_DIST;
  const cy =  Math.sin(camPitch) * CAM_DIST;
  const cz =  Math.cos(camPitch) * Math.cos(camYaw) * CAM_DIST;
  const target = new THREE.Vector3(pos.x, pos.y + 0.5, pos.z);
  camera.position.lerp(new THREE.Vector3(target.x + cx, target.y + cy, target.z + cz), 0.12);
  camera.lookAt(target);

  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
