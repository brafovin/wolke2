<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stick Parkour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a12;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 52px; font-weight: 900; letter-spacing: 8px;
      color: #fff;
      text-shadow: 0 0 40px rgba(140,100,255,0.7);
      margin-bottom: 10px; text-align: center;
    }
    p.sub { color: #334; font-size: 14px; letter-spacing: 2px; margin-bottom: 48px; text-align: center; }

    a.card {
      display: flex; flex-direction: column; align-items: center;
      text-decoration: none;
      background: rgba(140,100,255,0.07);
      border: 1px solid rgba(140,100,255,0.35);
      border-radius: 24px;
      padding: 50px 60px; gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      max-width: 400px; width: 100%;
    }
    a.card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(140,100,255,0.3);
      border-color: #aa77ff;
    }
    .icon { font-size: 64px; }
    .title { font-size: 28px; font-weight: 900; letter-spacing: 4px; color: #cc99ff; }
    .desc  { font-size: 14px; color: #445; text-align: center; line-height: 1.7; }
    .keys  {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      margin-top: 8px;
    }
    .key {
      padding: 5px 14px; border: 1px solid #334; border-radius: 8px;
      font-size: 12px; color: #778; letter-spacing: 1px;
    }
    .key.hi { border-color: #aa77ff55; color: #aa77ff; }
  </style>
</head>
<body>
  <h1>STICK PARKOUR</h1>
  <p class="sub">Strichmenschen Edition</p>

  <a class="card" href="/stickparkour.html">
    <div class="icon">🤸</div>
    <div class="title">SPIELEN</div>
    <div class="desc">
      Steuere einen Strichmenschen durch eine neon-beleuchtete Stadt.<br>
      Spring über Lücken, klettere auf Plattformen und nutze den Doppelsprung!
    </div>
    <div class="keys">
      <div class="key">← → Bewegen</div>
      <div class="key hi">Leertaste Springen</div>
      <div class="key hi">2× Leertaste Doppelsprung</div>
    </div>
  </a>
</body>
</html>
