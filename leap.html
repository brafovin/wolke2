<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEAP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    /* ── Power bar ── */
    #powerbar-wrap {
      position: fixed;
      bottom: 40px; left: 50%;
      transform: translateX(-50%);
      width: 220px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #powerbar-wrap.visible { opacity: 1; }
    #powerbar-label {
      text-align: center;
      color: #fff;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-shadow: 0 0 8px #fff5;
    }
    #powerbar-track {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #powerbar-fill {
      height: 100%;
      width: 0%;
      border-radius: 8px;
      background: linear-gradient(90deg, #4f4, #ff4, #f44);
      transition: background 0.1s;
      box-shadow: 0 0 10px currentColor;
    }

    /* ── HUD ── */
    #hud {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }
    #score-display {
      font-size: 52px; font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
      line-height: 1;
    }
    #score-label {
      font-size: 11px; letter-spacing: 3px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Overlay ── */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      z-index: 30;
    }
    #overlay h1 {
      font-size: 80px; font-weight: 900;
      letter-spacing: 10px;
      color: #fff;
      text-shadow: 0 0 40px rgba(255,255,255,0.3);
    }
    #overlay .tagline {
      color: #666; font-size: 15px;
      letter-spacing: 2px; margin: 12px 0 0;
    }
    #overlay .result {
      margin-top: 20px;
      font-size: 22px;
      color: #ffcc00;
      font-weight: 700;
      min-height: 32px;
    }
    #overlay .best-line {
      color: #555; font-size: 14px;
      margin-top: 6px; letter-spacing: 1px;
    }
    #overlay button {
      margin-top: 32px;
      padding: 16px 60px;
      font-size: 18px; font-weight: 700;
      letter-spacing: 3px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    #overlay button:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.7);
      transform: scale(1.04);
    }
    #overlay .hint {
      margin-top: 20px;
      color: #444; font-size: 13px; letter-spacing: 1px;
    }

    /* ── Combo popup ── */
    #combo-popup {
      position: fixed; top: 100px; left: 50%;
      transform: translateX(-50%);
      font-size: 28px; font-weight: 900;
      color: #ffcc00;
      text-shadow: 0 0 20px #ffcc00;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

<div id="hud">
  <div id="score-display">0</div>
  <div id="score-label">Sprünge</div>
</div>

<div id="powerbar-wrap">
  <div id="powerbar-label">KRAFT</div>
  <div id="powerbar-track">
    <div id="powerbar-fill"></div>
  </div>
</div>

<div id="combo-popup"></div>

<div id="overlay">
  <h1>LEAP</h1>
  <p class="tagline">Halte LEERTASTE · Loslassen = Sprung</p>
  <div class="result" id="result-text"></div>
  <div class="best-line" id="best-text"></div>
  <button id="startBtn">SPIELEN</button>
  <p class="hint">Drücke und halte die Leertaste um zu springen</p>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

// ── Renderer ─────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();

// Gradient sky via background color (animated in loop)
scene.background = new THREE.Color(0x1a0a2e);
scene.fog = new THREE.FogExp2(0x1a0a2e, 0.018);

// ── Camera ────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 8, 16);
camera.lookAt(0, 0, 0);

// ── Lights ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x334, 3));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(8, 18, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = keyLight.shadow.camera.bottom = -20;
keyLight.shadow.camera.right = keyLight.shadow.camera.top   =  20;
keyLight.shadow.camera.far = 60;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8866ff, 1.0);
rimLight.position.set(-8, 5, -10);
scene.add(rimLight);

// ── Stars ─────────────────────────────────────────────────────────────────
{
  const g = new THREE.BufferGeometry();
  const v = [];
  for (let i = 0; i < 1200; i++)
    v.push((Math.random()-0.5)*400, Math.random()*100+5, (Math.random()-0.5)*400);
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, transparent: true, opacity: 0.9 })));
}

// ── Block factory ─────────────────────────────────────────────────────────
const BLOCK_PALETTES = [
  [0xff6b6b, 0xff8e53],   // red-orange
  [0x6bcbff, 0x5580ff],   // blue
  [0x6bff9e, 0x20c997],   // green
  [0xffdd57, 0xffa94d],   // yellow
  [0xda77f2, 0xbe4bdb],   // purple
  [0x74c0fc, 0x228be6],   // sky
];

function pickPalette(idx) { return BLOCK_PALETTES[idx % BLOCK_PALETTES.length]; }

function createBlock(x, y, z, w, d, paletteIdx) {
  const [c1, c2] = pickPalette(paletteIdx);
  const group = new THREE.Group();

  // Main box
  const geo = new THREE.BoxGeometry(w, 0.55, d);
  const mat = new THREE.MeshStandardMaterial({
    color: c1, roughness: 0.35, metalness: 0.2,
    emissive: c1, emissiveIntensity: 0.05,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  // Bottom darker slab for depth
  const botGeo = new THREE.BoxGeometry(w + 0.05, 0.18, d + 0.05);
  const botMat = new THREE.MeshStandardMaterial({ color: c2, roughness: 0.6, metalness: 0.1 });
  const bot = new THREE.Mesh(botGeo, botMat);
  bot.position.y = -0.36;
  group.add(bot);

  // Top shine strip
  const shineGeo = new THREE.PlaneGeometry(w * 0.6, d * 0.6);
  const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.07, depthWrite: false });
  const shine = new THREE.Mesh(shineGeo, shineMat);
  shine.rotation.x = -Math.PI / 2;
  shine.position.y = 0.28;
  group.add(shine);

  group.position.set(x, y, z);
  scene.add(group);
  return { group, mesh, x, y, z, w, d, paletteIdx };
}

// ── Target ring ───────────────────────────────────────────────────────────
const ringGeo = new THREE.RingGeometry(0.55, 0.75, 32);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
const targetRing = new THREE.Mesh(ringGeo, ringMat);
targetRing.rotation.x = -Math.PI / 2;
targetRing.visible = false;
scene.add(targetRing);

// ── Trajectory dots ───────────────────────────────────────────────────────
const DOT_COUNT = 18;
const dotMeshes = [];
for (let i = 0; i < DOT_COUNT; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 })
  );
  scene.add(m);
  dotMeshes.push(m);
}

// ── Character ─────────────────────────────────────────────────────────────
const charGroup = new THREE.Group();
scene.add(charGroup);

// Body
const bodyMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.52, 0.7, 0.38),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 })
);
bodyMesh.position.y = 0.9;
bodyMesh.castShadow = true;
charGroup.add(bodyMesh);

// Head
const headMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.42, 0.42, 0.42),
  new THREE.MeshStandardMaterial({ color: 0xffcc88, roughness: 0.5 })
);
headMesh.position.y = 1.55;
headMesh.castShadow = true;
charGroup.add(headMesh);

// Eyes
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111 });
[-0.1, 0.1].forEach(ox => {
  const e = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.08), eyeMat);
  e.position.set(ox, 1.57, 0.2); charGroup.add(e);
});

// Legs
const legMat = new THREE.MeshStandardMaterial({ color: 0x334499, roughness: 0.6 });
const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.45, 0.19), legMat);
const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.45, 0.19), legMat);
lLeg.position.set(-0.15, 0.32, 0);
rLeg.position.set( 0.15, 0.32, 0);
charGroup.add(lLeg, rLeg);

// Arms
const armMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.48, 0.17), armMat);
const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.48, 0.17), armMat);
lArm.position.set(-0.38, 0.88, 0);
rArm.position.set( 0.38, 0.88, 0);
charGroup.add(lArm, rArm);

// ── Landing particles ──────────────────────────────────────────────────────
const particles = [];
function spawnLanding(x, y, z, color) {
  for (let i = 0; i < 14; i++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.15, 0.15),
      new THREE.MeshBasicMaterial({ color, transparent: true })
    );
    m.position.set(x, y + 0.4, z);
    scene.add(m);
    const angle = (i / 14) * Math.PI * 2;
    const spd = 2 + Math.random() * 3;
    particles.push({
      mesh: m,
      vx: Math.cos(angle) * spd,
      vy: 3 + Math.random() * 3,
      vz: Math.sin(angle) * spd,
      life: 0.8,
    });
  }
}

// ── Game state ─────────────────────────────────────────────────────────────
let score = 0;
let best  = parseInt(localStorage.getItem('leapBest') || '0');
let gameRunning = false;
let charging    = false;
let power       = 0;          // 0..1
let CHARGE_SPEED = 1.4;       // fills in ~0.7s

const STATES = { IDLE: 0, CHARGING: 1, JUMPING: 2, LANDED: 3 };
let state = STATES.IDLE;

// Jump physics
let jumpStart  = new THREE.Vector3();
let jumpEnd    = new THREE.Vector3();
let jumpVelY   = 0;
let jumpVelXZ  = new THREE.Vector3();
let jumpT      = 0;
const GRAVITY  = 22;

// Character world pos (on top of current block)
const charPos = new THREE.Vector3();

// Block list: [current, target]
let currentBlock = null;
let targetBlock  = null;

// Camera smoothing
const camTarget = new THREE.Vector3();

// ── UI refs ───────────────────────────────────────────────────────────────
const overlay       = document.getElementById('overlay');
const startBtn      = document.getElementById('startBtn');
const resultText    = document.getElementById('result-text');
const bestText      = document.getElementById('best-text');
const scoreDsp      = document.getElementById('score-display');
const powerWrap     = document.getElementById('powerbar-wrap');
const powerFill     = document.getElementById('powerbar-fill');
const comboPopup    = document.getElementById('combo-popup');
let comboTimer      = null;
let consecutivePerfect = 0;

function updateHUD() {
  scoreDsp.textContent = score;
}

function showCombo(text, color) {
  comboPopup.textContent = text;
  comboPopup.style.color = color;
  comboPopup.style.textShadow = `0 0 20px ${color}`;
  comboPopup.style.opacity = '1';
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => { comboPopup.style.opacity = '0'; }, 1000);
}

// ── Block generation ───────────────────────────────────────────────────────
let blockIdx = 0;
const allBlocks = [];

function clearBlocks() {
  for (const b of allBlocks) scene.remove(b.group);
  allBlocks.length = 0;
  blockIdx = 0;
}

function spawnStartBlock() {
  const b = createBlock(0, 0, 0, 4, 4, blockIdx++);
  allBlocks.push(b);
  return b;
}

function spawnNextBlock(fromBlock) {
  const progress = score;
  // Angle: random direction but not straight back
  const angle = (Math.random() - 0.5) * Math.PI * 1.1 + Math.PI; // roughly forward
  const dist  = 4.5 + progress * 0.18 + Math.random() * 1.5;
  const yDiff = (Math.random() - 0.5) * Math.min(3, 1 + progress * 0.12);
  const size  = Math.max(1.0, 3.0 - progress * 0.06 - Math.random() * 0.5);

  const nx = fromBlock.x + Math.sin(angle) * dist;
  const ny = fromBlock.y + yDiff;
  const nz = fromBlock.z + Math.cos(angle) * dist;

  const b = createBlock(nx, ny, nz, size, size, blockIdx++);
  allBlocks.push(b);
  return b;
}

// ── Required power to reach target ─────────────────────────────────────────
function calcRequiredPower(from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const dz = to.z - from.z;
  const horiz = Math.sqrt(dx*dx + dz*dz);

  // We want to find vy such that the projectile arc lands at (horiz, dy)
  // Using: time = horiz / vx_speed, then dy = vy*t - 0.5*g*t^2
  // We'll parameterize: vx_speed = horiz / t, find t via quadratic
  // Choose t so the arc is nice. We'll just normalize to [0..1] where 1 = perfect.
  // Actually: power controls jump height. We compute ideal launch speed.
  const g   = GRAVITY;
  const tof = Math.sqrt(2 * (horiz * 0.55 + 1.5) / g) * 2; // rough time of flight
  const vy  = dy / tof + 0.5 * g * tof;
  const vxz = horiz / tof;
  // Normalize into [0..1] assuming max speed ~ 18
  return Math.min(1, Math.max(0.1, (vy + vxz) / 26));
}

// ── Launch ────────────────────────────────────────────────────────────────
function launch(pwr) {
  if (!targetBlock || state !== STATES.IDLE) return;

  const from = charPos.clone();
  const to   = new THREE.Vector3(targetBlock.x, targetBlock.y + 0.3, targetBlock.z);

  const dx = to.x - from.x;
  const dz = to.z - from.z;
  const horiz = Math.sqrt(dx*dx + dz*dz);

  const g   = GRAVITY;
  const idealPwr = calcRequiredPower(currentBlock, targetBlock);

  // Map power to launch velocities
  // pwr=1 → perfect landing, pwr<ideal → short, pwr>ideal → long
  const scale   = pwr / idealPwr;
  const tof     = Math.sqrt(2 * (horiz * 0.55 + 1.5) / g) * 2;
  const vy      = (to.y - from.y) / tof * scale + 0.5 * g * tof * scale * 0.9;
  const vxz_mag = horiz / tof * scale;

  jumpVelY  = Math.max(4, vy);
  jumpVelXZ = new THREE.Vector3(
    horiz > 0 ? dx / horiz * vxz_mag : 0,
    0,
    horiz > 0 ? dz / horiz * vxz_mag : 0
  );

  jumpStart.copy(from);
  jumpT = 0;
  state = STATES.JUMPING;

  // Face target
  charGroup.rotation.y = Math.atan2(dx, dz);
  // Jump pose
  lLeg.rotation.x = -0.6;
  rLeg.rotation.x = -0.6;
  lArm.rotation.x = -1.0;
  rArm.rotation.x = -1.0;

  targetRing.visible = false;
  dotMeshes.forEach(d => { d.material.opacity = 0; });
}

// ── Check landing ──────────────────────────────────────────────────────────
function checkLanding() {
  if (!targetBlock) return false;
  const hw = targetBlock.w / 2 - 0.1;
  const hd = targetBlock.d / 2 - 0.1;
  const top = targetBlock.y + 0.275;
  return (
    Math.abs(charPos.x - targetBlock.x) < hw &&
    Math.abs(charPos.z - targetBlock.z) < hd &&
    charPos.y <= top + 0.3 && charPos.y >= top - 0.5
  );
}

// ── Game flow ──────────────────────────────────────────────────────────────
function startGame() {
  clearBlocks();
  particles.forEach(p => scene.remove(p.mesh)); particles.length = 0;

  score = 0; consecutivePerfect = 0;
  updateHUD();

  const start = spawnStartBlock();
  currentBlock = start;
  charPos.set(0, 0.275, 0);
  charGroup.position.copy(charPos);
  charGroup.rotation.y = 0;

  targetBlock = spawnNextBlock(currentBlock);
  placeTargetRing();

  state = STATES.IDLE;
  power = 0;
  charging = false;

  camTarget.set(0, 2, 6);
  camera.position.set(0, 8, 16);

  gameRunning = true;
  overlay.style.display = 'none';
}

function placeTargetRing() {
  if (!targetBlock) return;
  targetRing.position.set(targetBlock.x, targetBlock.y + 0.29, targetBlock.z);
  targetRing.visible = true;
}

function onLanded(perfect) {
  // Remove previous block after some time (keep last 3)
  if (allBlocks.length > 4) {
    const old = allBlocks.shift();
    scene.remove(old.group);
  }

  score++;
  updateHUD();

  if (score > best) {
    best = score;
    localStorage.setItem('leapBest', best);
  }

  spawnLanding(charPos.x, currentBlock.y + 0.275, charPos.z, pickPalette(currentBlock.paletteIdx)[0]);

  if (perfect) {
    consecutivePerfect++;
    if (consecutivePerfect >= 3) {
      score += consecutivePerfect;
      updateHUD();
      showCombo(`PERFEKT x${consecutivePerfect}! +${consecutivePerfect}`, '#ffcc00');
    } else {
      showCombo('PERFEKT!', '#88ff99');
    }
  } else {
    consecutivePerfect = 0;
  }

  currentBlock = targetBlock;
  targetBlock  = spawnNextBlock(currentBlock);
  placeTargetRing();

  // Squish on land
  charGroup.scale.set(1.25, 0.7, 1.25);
  lLeg.rotation.x = 0.4;
  rLeg.rotation.x = 0.4;
  lArm.rotation.x = 0.3;
  rArm.rotation.x = 0.3;

  state = STATES.IDLE;
}

function onDead() {
  gameRunning = false;
  state = STATES.IDLE;
  targetRing.visible = false;
  dotMeshes.forEach(d => { d.material.opacity = 0; });

  resultText.textContent = score > 0 ? `${score} Sprünge geschafft!` : 'Kein Sprung gelandet';
  bestText.textContent   = best > 0 ? `Bestleistung: ${best}` : '';
  startBtn.textContent   = score > 0 ? 'NOCHMAL' : 'SPIELEN';
  overlay.style.display  = 'flex';
}

startBtn.addEventListener('click', startGame);

// ── Input ─────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && gameRunning && state === STATES.IDLE) {
    charging = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' && charging && gameRunning) {
    charging = false;
    launch(power);
    power = 0;
    powerFill.style.width = '0%';
    powerWrap.classList.remove('visible');
    e.preventDefault();
  }
});

// Touch support
renderer.domElement.addEventListener('touchstart', e => {
  if (gameRunning && state === STATES.IDLE) { charging = true; e.preventDefault(); }
}, { passive: false });
renderer.domElement.addEventListener('touchend', e => {
  if (charging) {
    charging = false;
    launch(power);
    power = 0;
    powerFill.style.width = '0%';
    powerWrap.classList.remove('visible');
    e.preventDefault();
  }
}, { passive: false });

// ── Trajectory preview ─────────────────────────────────────────────────────
function updateTrajectory(pwr) {
  if (!targetBlock || state !== STATES.IDLE) { dotMeshes.forEach(d => d.material.opacity = 0); return; }

  const from = charPos.clone();
  const dx = targetBlock.x - from.x;
  const dz = targetBlock.z - from.z;
  const horiz = Math.sqrt(dx*dx + dz*dz);
  const idealPwr = calcRequiredPower(currentBlock, targetBlock);
  const scale = pwr / idealPwr;
  const g   = GRAVITY;
  const tof = Math.sqrt(2 * (horiz * 0.55 + 1.5) / g) * 2;
  const vy  = (targetBlock.y - from.y) / tof * scale + 0.5 * g * tof * scale * 0.9;
  const vxzMag = horiz / tof * scale;

  const vx = horiz > 0 ? dx / horiz * vxzMag : 0;
  const vz = horiz > 0 ? dz / horiz * vxzMag : 0;

  const simT = tof * scale * 1.15;
  for (let i = 0; i < DOT_COUNT; i++) {
    const t = (i / DOT_COUNT) * simT;
    dotMeshes[i].position.set(
      from.x + vx * t,
      from.y + vy * t - 0.5 * g * t * t,
      from.z + vz * t
    );
    dotMeshes[i].material.opacity = (1 - i / DOT_COUNT) * 0.6 * pwr;
  }
}

// ── Main loop ──────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let ringPulse = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!gameRunning) { renderer.render(scene, camera); return; }

  // ── Charging ─────────────────────────────────────────────────────────────
  if (charging && state === STATES.IDLE) {
    power = Math.min(1, power + CHARGE_SPEED * dt);
    powerWrap.classList.add('visible');
    powerFill.style.width = `${power * 100}%`;

    // Color shift green → yellow → red
    const r = Math.round(power < 0.5 ? power * 2 * 200 : 200);
    const g = Math.round(power < 0.5 ? 200 : (1 - power) * 2 * 200);
    powerFill.style.background = `rgb(${r},${g},0)`;

    // Charge pose: squat
    charGroup.scale.y = THREE.MathUtils.lerp(charGroup.scale.y, 0.8, 0.15);
    charGroup.position.y = charPos.y - (1 - charGroup.scale.y) * 0.3;
    lArm.rotation.z =  THREE.MathUtils.lerp(lArm.rotation.z,  0.7, 0.12);
    rArm.rotation.z = THREE.MathUtils.lerp(rArm.rotation.z, -0.7, 0.12);

    updateTrajectory(power);
  } else if (state === STATES.IDLE) {
    charGroup.scale.x = THREE.MathUtils.lerp(charGroup.scale.x, 1, 0.15);
    charGroup.scale.y = THREE.MathUtils.lerp(charGroup.scale.y, 1, 0.15);
    charGroup.scale.z = THREE.MathUtils.lerp(charGroup.scale.z, 1, 0.15);
    charGroup.position.copy(charPos);
    lArm.rotation.z = THREE.MathUtils.lerp(lArm.rotation.z, 0, 0.15);
    rArm.rotation.z = THREE.MathUtils.lerp(rArm.rotation.z, 0, 0.15);
    lLeg.rotation.x = THREE.MathUtils.lerp(lLeg.rotation.x, 0, 0.15);
    rLeg.rotation.x = THREE.MathUtils.lerp(rLeg.rotation.x, 0, 0.15);
    lArm.rotation.x = THREE.MathUtils.lerp(lArm.rotation.x, 0, 0.15);
    rArm.rotation.x = THREE.MathUtils.lerp(rArm.rotation.x, 0, 0.15);

    // Idle breathing
    headMesh.position.y = 1.55 + Math.sin(clock.elapsedTime * 1.5) * 0.02;
  }

  // ── In-air ───────────────────────────────────────────────────────────────
  if (state === STATES.JUMPING) {
    jumpT += dt;
    charPos.x = jumpStart.x + jumpVelXZ.x * jumpT;
    charPos.z = jumpStart.z + jumpVelXZ.z * jumpT;
    charPos.y = jumpStart.y + jumpVelY * jumpT - 0.5 * GRAVITY * jumpT * jumpT;

    charGroup.position.copy(charPos);
    charGroup.scale.set(1, 1, 1);

    // Spin in air
    charGroup.rotation.x = THREE.MathUtils.lerp(charGroup.rotation.x, -jumpVelY * 0.04, 0.08);

    // Check landing
    if (jumpT > 0.15 && checkLanding()) {
      charPos.set(targetBlock.x, targetBlock.y + 0.275, targetBlock.z);
      charGroup.rotation.x = 0;
      // Check if perfect (near center)
      const cx = Math.abs(charPos.x - targetBlock.x) / (targetBlock.w * 0.5);
      const cz = Math.abs(charPos.z - targetBlock.z) / (targetBlock.d * 0.5);
      const perfect = cx < 0.25 && cz < 0.25;
      onLanded(perfect);
    }

    // Fell off
    if (charPos.y < -10) { onDead(); return; }
    // Overshot and still going down past block level, far from target
    if (jumpT > 4) { onDead(); return; }
  }

  // ── Particles ─────────────────────────────────────────────────────────────
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); continue; }
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 22 * dt;
    p.mesh.scale.setScalar(p.life / 0.8);
    p.mesh.material.opacity = p.life / 0.8;
    p.mesh.material.transparent = true;
  }

  // ── Target ring pulse ─────────────────────────────────────────────────────
  if (targetBlock && state === STATES.IDLE) {
    ringPulse += dt * 2.5;
    const s = 1 + Math.sin(ringPulse) * 0.12;
    targetRing.scale.set(s, s, s);
    ringMat.opacity = 0.45 + Math.sin(ringPulse) * 0.2;
  }

  // ── Camera smooth follow ──────────────────────────────────────────────────
  const behind = new THREE.Vector3(0, 0, 1);
  if (targetBlock) {
    const dir = new THREE.Vector3(
      charPos.x - targetBlock.x,
      0,
      charPos.z - targetBlock.z
    ).normalize();
    behind.copy(dir);
  }

  const desiredCam = new THREE.Vector3(
    charPos.x + behind.x * 11,
    charPos.y + 7,
    charPos.z + behind.z * 11,
  );
  camera.position.lerp(desiredCam, 0.06);
  const lookAt = new THREE.Vector3(charPos.x, charPos.y + 1, charPos.z);
  camera.lookAt(lookAt);
  keyLight.position.set(charPos.x + 8, charPos.y + 18, charPos.z + 10);
  keyLight.target.position.copy(charPos);
  keyLight.target.updateMatrixWorld();

  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
