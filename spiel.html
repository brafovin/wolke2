<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Spiel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 10px 14px;
      border-radius: 8px;
      pointer-events: none;
      line-height: 1.7;
    }
    #info span { color: #7df; }
  </style>
</head>
<body>
  <div id="info">
    <b>Steuerung</b><br>
    <span>W / ↑</span> Vorwärts<br>
    <span>S / ↓</span> Zurück<br>
    <span>A / ←</span> Links<br>
    <span>D / →</span> Rechts<br>
    <span>Leertaste</span> Springen<br>
    <span>Maus ziehen</span> Kamera drehen
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

    // ── Scene ──────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 30, 120);

    // ── Renderer ───────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ── Camera ─────────────────────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
    let camYaw   = 0;   // horizontal rotation (mouse X)
    let camPitch = 0.3; // vertical angle (mouse Y)
    const CAM_DIST  = 8;
    const CAM_PITCH_MIN = 0.05;
    const CAM_PITCH_MAX = Math.PI / 2 - 0.05;

    // ── Lights ─────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xfff4d4, 1.2);
    sun.position.set(20, 40, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far  = 200;
    sun.shadow.camera.left = sun.shadow.camera.bottom = -40;
    sun.shadow.camera.right = sun.shadow.camera.top  =  40;
    scene.add(sun);

    // ── Ground ─────────────────────────────────────────────────────────────
    const groundGeo = new THREE.PlaneGeometry(200, 200, 40, 40);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x5a9e3a });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid lines for depth perception
    const grid = new THREE.GridHelper(200, 40, 0x3a7e1a, 0x3a7e1a);
    grid.material.opacity = 0.3;
    grid.material.transparent = true;
    scene.add(grid);

    // ── Platforms ──────────────────────────────────────────────────────────
    const platData = [
      { x:  6, z: -8,  w: 4, h: 0.5, d: 4, y: 1.5, color: 0xc8a060 },
      { x: -8, z: -5,  w: 5, h: 0.5, d: 3, y: 2.5, color: 0xd08050 },
      { x:  0, z: -14, w: 6, h: 0.5, d: 4, y: 4.0, color: 0xe09040 },
      { x: 10, z: -18, w: 4, h: 0.5, d: 4, y: 1.0, color: 0xb87040 },
      { x: -5, z: -20, w: 3, h: 0.5, d: 3, y: 6.0, color: 0xf0a030 },
    ];
    const platforms = [];
    for (const p of platData) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(p.w, p.h, p.d),
        new THREE.MeshLambertMaterial({ color: p.color })
      );
      mesh.position.set(p.x, p.y, p.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      platforms.push({ mesh, ...p });
    }

    // ── Trees (decorative) ─────────────────────────────────────────────────
    function addTree(x, z) {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.3, 1.5),
        new THREE.MeshLambertMaterial({ color: 0x7a4e2d })
      );
      trunk.position.set(x, 0.75, z);
      trunk.castShadow = true;
      scene.add(trunk);
      const top = new THREE.Mesh(
        new THREE.ConeGeometry(1.2, 2.5, 7),
        new THREE.MeshLambertMaterial({ color: 0x2d7a30 })
      );
      top.position.set(x, 2.75, z);
      top.castShadow = true;
      scene.add(top);
    }
    [[-12,5],[12,3],[-10,-15],[15,-10],[5,12],[-6,10],[18,8],[-15,2]].forEach(([x,z]) => addTree(x,z));

    // ── Character ──────────────────────────────────────────────────────────
    const charGroup = new THREE.Group();
    scene.add(charGroup);

    // Body
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.8, 0.4),
      new THREE.MeshLambertMaterial({ color: 0x3355ff })
    );
    body.position.y = 1.0;
    body.castShadow = true;
    charGroup.add(body);

    // Head
    const head = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.5, 0.5),
      new THREE.MeshLambertMaterial({ color: 0xffcc88 })
    );
    head.position.y = 1.7;
    head.castShadow = true;
    charGroup.add(head);

    // Eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111 });
    [-0.12, 0.12].forEach(xOff => {
      const eye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.1), eyeMat);
      eye.position.set(xOff, 1.73, 0.23);
      charGroup.add(eye);
    });

    // Legs
    const legMat = new THREE.MeshLambertMaterial({ color: 0x222288 });
    const leftLeg  = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.55, 0.22), legMat);
    const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.55, 0.22), legMat);
    leftLeg.position.set(-0.17, 0.33, 0);
    rightLeg.position.set( 0.17, 0.33, 0);
    leftLeg.castShadow = true;
    rightLeg.castShadow = true;
    charGroup.add(leftLeg, rightLeg);

    // Arms
    const armMat = new THREE.MeshLambertMaterial({ color: 0x3355ff });
    const leftArm  = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.55, 0.2), armMat);
    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.55, 0.2), armMat);
    leftArm.position.set(-0.43, 1.0, 0);
    rightArm.position.set( 0.43, 1.0, 0);
    leftArm.castShadow = true;
    rightArm.castShadow = true;
    charGroup.add(leftArm, rightArm);

    // ── Physics state ──────────────────────────────────────────────────────
    const pos     = new THREE.Vector3(0, 0, 0);
    const vel     = new THREE.Vector3(0, 0, 0);
    const GRAVITY = -20;
    const SPEED   = 7;
    const JUMP    = 9;
    let onGround  = false;

    // ── Input ──────────────────────────────────────────────────────────────
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup',   e => { keys[e.code] = false; });

    // Mouse camera control
    let isDragging = false;
    let lastMX = 0, lastMY = 0;
    renderer.domElement.addEventListener('mousedown', e => {
      isDragging = true;
      lastMX = e.clientX;
      lastMY = e.clientY;
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - lastMX;
      const dy = e.clientY - lastMY;
      lastMX = e.clientX;
      lastMY = e.clientY;
      camYaw   -= dx * 0.005;
      camPitch -= dy * 0.005;
      camPitch = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, camPitch));
    });

    // Touch camera control
    let touchStart = null;
    renderer.domElement.addEventListener('touchstart', e => {
      if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    renderer.domElement.addEventListener('touchmove', e => {
      if (!touchStart || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - touchStart.x;
      const dy = e.touches[0].clientY - touchStart.y;
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      camYaw   -= dx * 0.006;
      camPitch -= dy * 0.006;
      camPitch = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, camPitch));
    });

    // ── Helpers ────────────────────────────────────────────────────────────
    function getFloorY(x, z, charW) {
      // Check platforms
      for (const p of platforms) {
        const hw = p.w / 2 + charW;
        const hd = p.d / 2 + charW;
        if (x > p.x - hw && x < p.x + hw && z > p.z - hd && z < p.z + hd) {
          const top = p.y + p.h / 2;
          if (pos.y >= top - 0.1) return top;
        }
      }
      return 0;
    }

    const clock = new THREE.Clock();
    let walkTime = 0;

    // ── Game loop ──────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // Movement direction relative to camera yaw
      const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
      const right   = new THREE.Vector3( Math.cos(camYaw), 0, -Math.sin(camYaw));

      const moveDir = new THREE.Vector3();
      if (keys['KeyW'] || keys['ArrowUp'])    moveDir.addScaledVector(forward,  1);
      if (keys['KeyS'] || keys['ArrowDown'])  moveDir.addScaledVector(forward, -1);
      if (keys['KeyA'] || keys['ArrowLeft'])  moveDir.addScaledVector(right,   -1);
      if (keys['KeyD'] || keys['ArrowRight']) moveDir.addScaledVector(right,    1);

      const moving = moveDir.lengthSq() > 0;
      if (moving) {
        moveDir.normalize();
        vel.x = moveDir.x * SPEED;
        vel.z = moveDir.z * SPEED;
        charGroup.rotation.y = Math.atan2(moveDir.x, moveDir.z);
        walkTime += dt;
      } else {
        vel.x *= 0.8;
        vel.z *= 0.8;
      }

      // Jump
      if ((keys['Space'] || keys['KeyZ']) && onGround) {
        vel.y = JUMP;
        onGround = false;
      }

      // Gravity
      vel.y += GRAVITY * dt;

      // Move
      pos.x += vel.x * dt;
      pos.y += vel.y * dt;
      pos.z += vel.z * dt;

      // Floor collision
      const floor = getFloorY(pos.x, pos.z, 0.3);
      if (pos.y <= floor) {
        pos.y = floor;
        vel.y = 0;
        onGround = true;
      } else {
        onGround = false;
      }

      // World boundary
      pos.x = Math.max(-98, Math.min(98, pos.x));
      pos.z = Math.max(-98, Math.min(98, pos.z));

      charGroup.position.copy(pos);

      // Leg/arm animation while walking
      if (moving && onGround) {
        const swing = Math.sin(walkTime * 8) * 0.4;
        leftLeg.rotation.x  =  swing;
        rightLeg.rotation.x = -swing;
        leftArm.rotation.x  = -swing;
        rightArm.rotation.x =  swing;
      } else {
        leftLeg.rotation.x  = THREE.MathUtils.lerp(leftLeg.rotation.x,  0, 0.2);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.2);
        leftArm.rotation.x  = THREE.MathUtils.lerp(leftArm.rotation.x,  0, 0.2);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.2);
      }

      // Slight body bob while jumping
      if (!onGround) {
        charGroup.position.y = pos.y;
      }

      // Camera follow
      const cx = Math.cos(camPitch) * Math.sin(camYaw) * CAM_DIST;
      const cy = Math.sin(camPitch) * CAM_DIST;
      const cz = Math.cos(camPitch) * Math.cos(camYaw) * CAM_DIST;
      const target = new THREE.Vector3(pos.x, pos.y + 1.2, pos.z);
      camera.position.set(target.x + cx, target.y + cy, target.z + cz);
      camera.lookAt(target);

      renderer.render(scene, camera);
    }

    animate();

    // ── Resize ─────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
